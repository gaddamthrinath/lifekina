<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />
  
  <!-- Sparkles Logo Mark (matches sidebar & header) -->
  <g transform="translate(256, 180)">
    <!-- Primary Sparkle 4-point star -->
    <path d="M 0 -70 Q 0 0 70 0 Q 0 0 0 70 Q 0 0 -70 0 Q 0 0 0 -70 Z" fill="#ffffff" />
    <!-- Secondary small sparkle top right -->
    <path d="M 52 -45 Q 52 -25 72 -25 Q 52 -25 52 -5 Q 52 -25 32 -25 Q 52 -25 52 -45 Z" fill="#ffffff" opacity="0.92"/>
    <!-- Tiny sparkle bottom left -->
    <circle cx="-42" cy="42" r="6" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- Lifekina Wording -->
  <text x="256" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Lifekina</text>
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a7f3d0" letter-spacing="2">PRIVATE sanctuary</text>
</svg>
